                        </div>
                        <div className="form-group">
                            <label className="form-label">Mobile</label>
                            <div style={{ fontSize: '1.1rem' }}>+91 {person.mobile}</div>
                        </div>
                        <div className="form-group">
                            <label className="form-label">Role</label>
                            <div style={{ fontSize: '1.1rem' }}>{person.role}</div>
                        </div>
                        {person.address && (
                            <div className="form-group">
                                <label className="form-label">Address</label>
                                <div style={{ fontSize: '1rem', background: '#f3f4f6', padding: '0.5rem', borderRadius: '4px' }}>{person.address}</div>
                            </div>
                        )}
                        {person.aadhaarNumber && (
                            <div className="form-group">
                                <label className="form-label">Aadhaar Number</label>
                                <div style={{ fontSize: '1rem', fontFamily: 'monospace' }}>{person.aadhaarNumber}</div>
                            </div>
                        )}
                        {person.gstNumber && (
                            <div className="form-group">
                                <label className="form-label">GST Number</label>
                                <div style={{ fontSize: '1rem', fontFamily: 'monospace' }}>{person.gstNumber}</div>
                            </div>
                        )}
                    </div>
                </div>
            );
        };

        // ─── Module Detail Page (P2P / Shopkeeper / Wholesaler) ──────────────
        const ModulePage = ({ module }) => {
            const { currentUser, navigate } = useContext(AppContext);
            const [transactions, setTransactions] = useState([]);
            const [loading, setLoading] = useState(true);
            const [payingTxn, setPayingTxn] = useState(null); // transaction being paid
            const [viewingPerson, setViewingPerson] = useState(null); // person whose details are being viewed
            const [sendingReminder, setSendingReminder] = useState(false); // track reminder state

            const handleSendReminder = async (receiverId) => {
                setSendingReminder(true);
                try {
                    const token = localStorage.getItem('udharPayToken');
                    await axios.post('http://localhost:5000/api/transactions/remind',
                        { receiverId },
                        { headers: { Authorization: `Bearer ${token}` } }
                    );
                    alert('Reminder sent successfully! It will appear in their Inbox.');
                } catch (error) {
                    console.error('Failed to send reminder', error);
                    alert('Failed to send reminder. ' + (error.response?.data?.message || ''));
                } finally {
                    setSendingReminder(false);
                }
            };

            const moduleLabels = { FRIEND: 'P2P Lending', SHOP: 'Shopkeeper', WHOLESALER: 'Wholesaler' };
            const moduleIcons = { FRIEND: '👥', SHOP: '🏪', WHOLESALER: '🏭' };
            const moduleColors = { FRIEND: '#4CAF50', SHOP: '#2196F3', WHOLESALER: '#FF9800' };

            const loadTransactions = () => {
                const token = localStorage.getItem('udharPayToken');
                if (!token) return;
                setLoading(true);
                axios.get(`http://localhost:5000/api/transactions?module=${module}&limit=100`, {
                    headers: { Authorization: `Bearer ${token}` }
                }).then(res => {
                    setTransactions(res.data.data.transactions);
                }).catch(err => console.error('Failed to load module transactions:', err))
                    .finally(() => setLoading(false));
            };

            useEffect(() => { loadTransactions(); }, [module]);

            // Group transactions by contact person — track payments by direction
            const contactMap = {};
            transactions.forEach(txn => {
                const iAmSender = txn.senderId === currentUser?.id;
                const other = iAmSender ? txn.receiver : txn.sender;
                if (!other) return;
                if (!contactMap[other.id]) {
                    contactMap[other.id] = {
                        person: other, transactions: [],
                        udharGiven: 0,     // credit I gave to this person
                        udharTaken: 0,     // credit I took from this person
                        paidByMe: 0,       // I paid back to this person
                        paidByThem: 0,     // they paid back to me
                    };
                }
                // Split payments by who paid
                (txn.payments || []).filter(p => p.status === 'COMPLETED').forEach(p => {
                    if (p.payerId === currentUser?.id) {
                        contactMap[other.id].paidByMe += p.amount;
                    } else {
                        contactMap[other.id].paidByThem += p.amount;
                    }
                });
                contactMap[other.id].transactions.push(txn);
                if (iAmSender) contactMap[other.id].udharGiven += txn.amount;
                else contactMap[other.id].udharTaken += txn.amount;
            });
            const contacts = Object.values(contactMap).map(c => {
                const actualTaken = c.udharTaken - c.paidByMe;
                const actualGiven = c.udharGiven - c.paidByThem;
                const netBalance = actualGiven - actualTaken; // positive = they owe me, negative = I owe them

                return {
                    ...c,
                    netBalance,
                    displayTheyOweMe: Math.max(0, netBalance),
                    displayIOweThem: Math.max(0, -netBalance)
                };
            });

            // Overall module summary
            const totalUdharTaken = contacts.reduce((s, c) => s + c.udharTaken, 0);
            const totalUdharGiven = contacts.reduce((s, c) => s + c.udharGiven, 0);
            const totalPaidBack = contacts.reduce((s, c) => s + c.paidByMe, 0);
            const totalRecovered = contacts.reduce((s, c) => s + c.paidByThem, 0);

            // Replaced naive totals with sum of net balances to match backend and prevent inflating numbers
            const iStillOweTotal = contacts.reduce((s, c) => s + c.displayIOweThem, 0);
            const othersOweMeTotal = contacts.reduce((s, c) => s + c.displayTheyOweMe, 0);

            const moduleNameMap = { FRIEND: 'Friend Udhar Summary', SHOP: 'Shop Udhar Summary', WHOLESALER: 'Wholesaler Udhar Summary' };

            return (
                <div className="container">
                    <button className="btn btn-outline mb-2" onClick={() => navigate('dashboard')}>← Back</button>

                    <div className="card-header mb-2" style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center' }}>
                        <h2>{moduleIcons[module]} {moduleLabels[module]}</h2>
                        <button className="btn btn-primary" onClick={() => navigate('record-txn', { module })}>
                            + Record New
                        </button>
                    </div>

                    {/* Summary Banner */}
                    <div className="summary-card mb-3" style={{ background: `linear-gradient(135deg, ${moduleColors[module]}, ${moduleColors[module]}cc)` }}>
                        <div className="summary-label">{moduleNameMap[module]}</div>
                        <div className="summary-detail" style={{ flexWrap: 'wrap', gap: '0.5rem' }}>
                            {totalUdharTaken > 0 && (
                                <div style={{ textAlign: 'center' }}>
                                    <div style={{ fontSize: '1.1rem', fontWeight: 'bold' }}>₹{totalUdharTaken.toLocaleString()}</div>
                                    <div style={{ fontSize: '0.8rem', opacity: 0.85 }}>📥 Udhar Taken</div>
                                </div>
                            )}
                            {totalUdharGiven > 0 && (
                                <div style={{ textAlign: 'center' }}>
                                    <div style={{ fontSize: '1.1rem', fontWeight: 'bold' }}>₹{totalUdharGiven.toLocaleString()}</div>
                                    <div style={{ fontSize: '0.8rem', opacity: 0.85 }}>📤 Udhar Given</div>
                                </div>
                            )}
                            {totalPaidBack > 0 && (
                                <div style={{ textAlign: 'center' }}>
                                    <div style={{ fontSize: '1.1rem', fontWeight: 'bold' }}>₹{totalPaidBack.toLocaleString()}</div>
                                    <div style={{ fontSize: '0.8rem', opacity: 0.85 }}>✅ Paid Back</div>
                                </div>
                            )}
                            {iStillOweTotal > 0 && (
                                <div style={{ textAlign: 'center' }}>
                                    <div style={{ fontSize: '1.25rem', fontWeight: '800' }}>₹{iStillOweTotal.toLocaleString()}</div>
                                    <div style={{ fontSize: '0.8rem', opacity: 0.85 }}>⏳ Still to Pay</div>
                                </div>
                            )}
                            {othersOweMeTotal > 0 && (
                                <div style={{ textAlign: 'center' }}>
                                    <div style={{ fontSize: '1.25rem', fontWeight: '800' }}>₹{othersOweMeTotal.toLocaleString()}</div>
                                    <div style={{ fontSize: '0.8rem', opacity: 0.85 }}>💰 To Recover</div>
                                </div>
                            )}
                        </div>
                    </div>

                    {/* Contacts Lists */}
                    {loading ? (
                        <div className="loading"><div className="spinner"></div><p>Loading...</p></div>
                    ) : contacts.length === 0 ? (
                        <div className="card empty-state">
                            <div className="empty-icon">{moduleIcons[module]}</div>
                            <p>No transactions yet in this module</p>
                            <button className="btn btn-primary" onClick={() => navigate('record-txn', { module })}>
                                + Record First Transaction
                            </button>
                        </div>
                    ) : (
                        <div style={{ display: 'flex', flexDirection: 'column', gap: '2rem' }}>
                            <div style={{
                                display: 'grid',
                                gridTemplateColumns: window.innerWidth > 768 ? '1fr 1fr' : '1fr',
                                gap: '2rem'
                            }}>

                                {/* --- LEFT COLUMN: UDHAR TAKEN (TO PAY) --- */}
                                <div>
                                    {contacts.filter(c => c.displayIOweThem > 0).length > 0 && (
                                        <div className="card" style={{ borderTop: '4px solid #ef4444' }}>
                                            <h3 className="mb-3" style={{ color: '#ef4444', display: 'flex', alignItems: 'center', gap: '0.5rem' }}>
                                                <span>📥</span> Udhar Taken (To Pay)
                                            </h3>
                                            <div style={{ display: 'flex', flexDirection: 'column', gap: '1.5rem' }}>
                                                {contacts.filter(c => c.displayIOweThem > 0).map(({ person, transactions: txns, displayIOweThem }) => {
                                                    const iOwe = displayIOweThem;
                                                    const pendingTxns = txns.filter(t => t.receiverId === currentUser?.id && ((t.payments || []).filter(p => p.status === 'COMPLETED').reduce((s, p) => s + p.amount, 0) < t.amount));

                                                    return (
                                                        <div key={person.id} style={{ border: '1px solid var(--border)', borderRadius: '12px', padding: '1rem', background: '#fff' }}>
                                                            <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'flex-start' }}>
                                                                <div>
                                                                    <div style={{ display: 'flex', alignItems: 'center', gap: '0.5rem' }}>
                                                                        <div style={{ fontWeight: '700', fontSize: '1.1rem' }}>{person.name}</div>
                                                                        <button className="btn btn-outline" style={{ padding: '0.1rem 0.4rem', fontSize: '0.7rem', borderRadius: '4px' }} onClick={() => setViewingPerson(person)}>ℹ️ Info</button>
                                                                    </div>
                                                                    <div style={{ color: 'var(--text-medium)', fontSize: '0.875rem' }}>+91 {person.mobile} • {person.role}</div>
                                                                </div>
                                                                <div style={{ textAlign: 'right' }}>
                                                                    <div style={{ fontWeight: '800', fontSize: '1.25rem', color: '#ef4444' }}>₹{iOwe.toLocaleString()}</div>
                                                                    <div style={{ fontSize: '0.75rem', color: 'var(--text-medium)' }}>⏳ you owe them</div>
                                                                </div>
                                                            </div>

                                                            <div style={{ marginTop: '1rem', display: 'flex', flexDirection: 'column', gap: '0.5rem' }}>
                                                                {pendingTxns.slice(0, 3).map(txn => {
                                                                    const paid = (txn.payments || []).filter(p => p.status === 'COMPLETED').reduce((s, p) => s + p.amount, 0);
                                                                    const pendingAmt = txn.amount - paid;
                                                                    return (
                                                                        <div key={txn.id} style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', background: '#fef2f2', border: '1px solid #fecaca', borderRadius: '8px', padding: '0.75rem' }}>
                                                                            <div>
                                                                                <span style={{ fontSize: '0.85rem', color: '#b91c1c', fontWeight: '600' }}>📥 Got ₹{txn.amount.toLocaleString()}</span>
                                                                                {txn.description && <span style={{ fontSize: '0.75rem', color: '#991b1b', marginLeft: '0.5rem' }}>— {txn.description}</span>}
                                                                                <div style={{ fontSize: '0.7rem', color: '#991b1b', opacity: 0.8, marginTop: '0.2rem' }}>{new Date(txn.createdAt).toLocaleDateString('en-IN')}</div>
                                                                            </div>
                                                                            <button className="btn btn-accent" style={{ padding: '0.4rem 1rem', fontSize: '0.85rem', fontWeight: '600' }} onClick={() => setPayingTxn(txn)}>
                                                                                Pay ₹{pendingAmt.toLocaleString()}
                                                                            </button>
                                                                        </div>
                                                                    );
                                                                })}
                                                            </div>
                                                        </div>
                                                    );
                                                })}
                                            </div>
                                        </div>
                                    )}
                                </div>

                                {/* --- RIGHT COLUMN: UDHAR GIVEN (TO RECOVER) --- */}
                                <div>
                                    {contacts.filter(c => c.displayTheyOweMe > 0).length > 0 && (
                                        <div className="card" style={{ borderTop: '4px solid #10b981' }}>
                                            <h3 className="mb-3" style={{ color: '#10b981', display: 'flex', alignItems: 'center', gap: '0.5rem' }}>
                                                <span>📤</span> Udhar Given (To Recover)
                                            </h3>
                                            <div style={{ display: 'flex', flexDirection: 'column', gap: '1.5rem' }}>
                                                {contacts.filter(c => c.displayTheyOweMe > 0).map(({ person, transactions: txns, displayTheyOweMe }) => {
                                                    const theyOwe = displayTheyOweMe;
                                                    const pendingTxns = txns.filter(t => t.senderId === currentUser?.id && ((t.payments || []).filter(p => p.status === 'COMPLETED').reduce((s, p) => s + p.amount, 0) < t.amount));

                                                    return (
                                                        <div key={person.id} style={{ border: '1px solid var(--border)', borderRadius: '12px', padding: '1rem', background: '#fff' }}>
                                                            <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'flex-start' }}>
                                                                <div>
                                                                    <div style={{ display: 'flex', alignItems: 'center', gap: '0.5rem' }}>
                                                                        <div style={{ fontWeight: '700', fontSize: '1.1rem' }}>{person.name}</div>
                                                                        <button className="btn btn-outline" style={{ padding: '0.1rem 0.4rem', fontSize: '0.7rem', borderRadius: '4px' }} onClick={() => setViewingPerson(person)}>ℹ️ Info</button>
                                                                    </div>
                                                                    <div style={{ color: 'var(--text-medium)', fontSize: '0.875rem' }}>+91 {person.mobile} • {person.role}</div>
                                                                </div>
                                                                <div style={{ textAlign: 'right' }}>
                                                                    <div style={{ fontWeight: '800', fontSize: '1.25rem', color: '#10b981' }}>₹{theyOwe.toLocaleString()}</div>
                                                                    <div style={{ fontSize: '0.75rem', color: 'var(--text-medium)' }}>💰 they owe you</div>
                                                                </div>
                                                            </div>

                                                            <div style={{ marginTop: '1rem', display: 'flex', flexDirection: 'column', gap: '0.5rem' }}>
                                                                {pendingTxns.slice(0, 3).map(txn => {
                                                                    const paid = (txn.payments || []).filter(p => p.status === 'COMPLETED').reduce((s, p) => s + p.amount, 0);
                                                                    const pendingAmt = txn.amount - paid;
                                                                    return (
                                                                        <div key={txn.id} style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', background: '#ecfdf5', border: '1px solid #a7f3d0', borderRadius: '8px', padding: '0.75rem' }}>
                                                                            <div>
                                                                                <span style={{ fontSize: '0.85rem', color: '#047857', fontWeight: '600' }}>📤 Gave ₹{txn.amount.toLocaleString()}</span>
                                                                                {txn.description && <span style={{ fontSize: '0.75rem', color: '#065f46', marginLeft: '0.5rem' }}>— {txn.description}</span>}
                                                                                <div style={{ fontSize: '0.7rem', color: '#065f46', opacity: 0.8, marginTop: '0.2rem' }}>{new Date(txn.createdAt).toLocaleDateString('en-IN')}</div>
                                                                            </div>
                                                                            <div style={{ fontWeight: '600', color: '#047857', fontSize: '0.85rem' }}>
                                                                                ₹{pendingAmt.toLocaleString()} pending
                                                                            </div>
                                                                        </div>
                                                                    );
                                                                })}
                                                            </div>

                                                            <button
                                                                className="btn btn-primary"
                                                                style={{ marginTop: '1rem', width: '100%', padding: '0.7rem', display: 'flex', justifyContent: 'center', alignItems: 'center', gap: '0.5rem' }}
                                                                onClick={() => handleSendReminder(person.id)}
                                                                disabled={sendingReminder}
                                                            >
                                                                {sendingReminder ? '⏳ Sending...' : '🔔 Send Message to Pay'}
                                                            </button>
                                                        </div>
                                                    );
                                                })}
                                            </div>
                                        </div>
                                    )}
                                </div>

                            </div>

                            {/* --- SETTLED --- */}
                            {contacts.filter(c => c.displayIOweThem === 0 && c.displayTheyOweMe === 0).length > 0 && (
                                <div className="card" style={{ opacity: 0.8 }}>
                                    <h3 className="mb-2" style={{ color: 'var(--text-medium)', display: 'flex', alignItems: 'center', gap: '0.5rem' }}>
                                        <span>✅</span> Settled Accounts
                                    </h3>
                                    {contacts.filter(c => c.displayIOweThem === 0 && c.displayTheyOweMe === 0).map(({ person }) => (
                                        <div key={person.id} style={{ display: 'flex', justifyContent: 'space-between', padding: '0.5rem 0', borderBottom: '1px solid var(--border)' }}>
                                            <div>
                                                <div style={{ fontWeight: '600' }}>{person.name}</div>
                                                <div style={{ fontSize: '0.75rem', color: 'var(--text-light)' }}>{person.role}</div>
                                            </div>
                                            <div style={{ fontSize: '0.8rem', color: '#22c55e', fontWeight: '600' }}>Fully Settled</div>
                                        </div>
                                    ))}
                                </div>
                            )}

                        </div>
                    )}

                    {/* Pay Modal */}
                    {
                        payingTxn && (
                            <PayPendingModal
                                transaction={payingTxn}
                                currentUserId={currentUser?.id}
                                onClose={() => setPayingTxn(null)}
                                onSuccess={() => { setPayingTxn(null); loadTransactions(); }}
                            />
                        )
                    }

                    {
                        viewingPerson && (
                            <ContactDetailsModal
                                person={viewingPerson}
                                onClose={() => setViewingPerson(null)}
                            />
                        )
                    }
                </div >
            );
        };

        // ─── Record Transaction Page ──────────────────────────────────────────
        const RecordTransactionPage = () => {
            const { currentUser, navigate, navParams } = useContext(AppContext);
            const [step, setStep] = useState(1); // 1=find, 2=details, 3=confirm
            const [findMode, setFindMode] = useState('search'); // 'search' | 'qrid'
            const [searchQuery, setSearchQuery] = useState('');
            const [searchResults, setSearchResults] = useState([]);
            const [searching, setSearching] = useState(false);
            const [selectedContact, setSelectedContact] = useState(null);
            const [qrIdInput, setQrIdInput] = useState('');
            const [amount, setAmount] = useState('');
            const [direction, setDirection] = useState('gave'); // 'gave' | 'received'
            const [txnModule, setTxnModule] = useState(navParams?.module || 'FRIEND');
            const [description, setDescription] = useState('');
            const [invoiceNumber, setInvoiceNumber] = useState('');
            const [invoiceDate, setInvoiceDate] = useState('');
            const [submitting, setSubmitting] = useState(false);
            const [error, setError] = useState(null);
            const [success, setSuccess] = useState(false);
            const [balanceData, setBalanceData] = useState(null);
            const [loadingBalance, setLoadingBalance] = useState(false);

            useEffect(() => {
                const fetchBalance = async () => {
                    if (step === 2 && selectedContact) {
                        setLoadingBalance(true);
                        try {
                            const token = localStorage.getItem('udharPayToken');
                            const res = await axios.get(`http://localhost:5000/api/transactions/balance/${selectedContact.id}`, {
                                headers: { Authorization: `Bearer ${token}` }
                            });
                            setBalanceData(res.data.data);
                        } catch (err) {
                            console.error('Failed to fetch balance', err);
                        } finally {
                            setLoadingBalance(false);
                        }
                    } else {
                        setBalanceData(null);
                    }
                };
                fetchBalance();
            }, [step, selectedContact]);

            const moduleOptions = [
                { value: 'FRIEND', label: '👥 Friend (P2P)' },
                { value: 'SHOP', label: '🏪 Shopkeeper' },
                { value: 'WHOLESALER', label: '🏭 Wholesaler' },
            ];

            // Live search
            useEffect(() => {
                if (findMode !== 'search' || searchQuery.trim().length < 2) {
                    setSearchResults([]);
                    return;
                }
                const timer = setTimeout(async () => {
                    setSearching(true);
                    try {
                        const token = localStorage.getItem('udharPayToken');
                        const res = await axios.get(`http://localhost:5000/api/transactions/search-user?q=${encodeURIComponent(searchQuery.trim())}`, {
                            headers: { Authorization: `Bearer ${token}` }
                        });
                        setSearchResults(res.data.data);
                    } catch (err) {
                        console.error('Search failed:', err);
                    } finally {
                        setSearching(false);
                    }
                }, 400);
                return () => clearTimeout(timer);
            }, [searchQuery, findMode]);

            const handleSelectContact = (user) => {
                setSelectedContact(user);
                setSearchResults([]);
                setStep(2);
            };

            const handleQrIdLookup = async () => {
                if (!qrIdInput.trim()) return;
                setSearching(true);
                setError(null);
                try {
                    const token = localStorage.getItem('udharPayToken');
                    const res = await axios.get(`http://localhost:5000/api/transactions/by-qr/${encodeURIComponent(qrIdInput.trim())}`, {
                        headers: { Authorization: `Bearer ${token}` }
                    });
                    setSelectedContact(res.data.data);
                    setStep(2);
                } catch (err) {
                    setError(err.response?.data?.message || 'QR ID not found. Check and try again.');
                } finally {
                    setSearching(false);
                }
            };

            const handleSubmit = async () => {
                if (!selectedContact || !amount || parseFloat(amount) <= 0) {
                    setError('Please fill all required fields.');
                    return;
                }
                if ((txnModule === 'SHOP' || txnModule === 'WHOLESALER') && direction === 'gave') {
                    if (balanceData && parseFloat(amount) > balanceData.iOweThem) {
                        setError(`For ${txnModule.toLowerCase()}s, you cannot pay more than your pending udhar of ₹${balanceData.iOweThem}.`);
                        return;
                    }
                }
                setSubmitting(true);
                setError(null);
                try {
                    const token = localStorage.getItem('udharPayToken');
                    const res = await axios.post('http://localhost:5000/api/transactions', {
                        receiverId: selectedContact.id,
                        amount: parseFloat(amount),
                        module: txnModule,
                        description: description || undefined,
                        direction,
                        invoiceNumber: invoiceNumber || undefined,
                        invoiceDate: invoiceDate || undefined,
                    }, { headers: { Authorization: `Bearer ${token}` } });

                    // We store the backend message (which might contain auto-settlement detail)
                    // or just "true" if missing
                    setSuccess(res.data?.message || true);
                } catch (err) {
                    setError(err.response?.data?.message || 'Failed to record transaction. Try again.');
                } finally {
                    setSubmitting(false);
                }
            };

            const backPage = navParams?.module
                ? (navParams.module === 'FRIEND' ? 'p2p' : navParams.module === 'SHOP' ? 'shopkeeper' : 'wholesaler')
                : 'dashboard';

            if (success) {
                return (
                    <div className="container">
                        <div className="card" style={{ textAlign: 'center', padding: '3rem' }}>
                            <div style={{ fontSize: '4rem', marginBottom: '1rem' }}>✅</div>
                            <h2>Transaction Recorded!</h2>
                            {typeof success === 'string' && <div className="alert-success mb-3">{success}</div>}
                            <p className="text-muted mb-3">
                                {direction === 'gave' ? 'You gave' : 'You received'} ₹{parseFloat(amount).toLocaleString()} {direction === 'gave' ? 'to' : 'from'} <strong>{selectedContact?.name}</strong>
                            </p>
                            <div style={{ display: 'flex', gap: '1rem', justifyContent: 'center', flexWrap: 'wrap' }}>
                                <button className="btn btn-primary" onClick={() => navigate(backPage)}>← Back to Module</button>
                                <button className="btn btn-outline" onClick={() => { setStep(1); setSelectedContact(null); setAmount(''); setDescription(''); setSuccess(false); }}>
                                    + Record Another
                                </button>
                            </div>
                        </div>
                    </div>
                );
            }

            return (
                <div className="container">
                    <button className="btn btn-outline mb-2" onClick={() => navigate(backPage)}>← Back</button>

                    {/* Step indicator */}
                    <div style={{ display: 'flex', gap: '0.5rem', marginBottom: '1.5rem', alignItems: 'center' }}>
                        {['Find Contact', 'Details', 'Confirm'].map((label, i) => (
                            <React.Fragment key={i}>
                                <div style={{
                                    display: 'flex', alignItems: 'center', gap: '0.4rem',
                                    color: step > i + 1 ? '#22c55e' : step === i + 1 ? 'var(--primary)' : 'var(--text-light)',
                                    fontWeight: step === i + 1 ? '700' : '400', fontSize: '0.85rem'
                                }}>
                                    <div style={{
                                        width: '24px', height: '24px', borderRadius: '50%', display: 'flex', alignItems: 'center', justifyContent: 'center', fontSize: '0.75rem', fontWeight: '700',
                                        background: step > i + 1 ? '#22c55e' : step === i + 1 ? 'var(--primary)' : 'var(--border)',
                                        color: step >= i + 1 ? 'white' : 'var(--text-medium)'
                                    }}>{step > i + 1 ? '✓' : i + 1}</div>
                                    {label}
                                </div>
                                {i < 2 && <div style={{ flex: 1, height: '2px', background: step > i + 1 ? '#22c55e' : 'var(--border)' }} />}
                            </React.Fragment>
                        ))}
                    </div>

                    {/* ── Step 1: Find Contact ── */}
                    {step === 1 && (
                        <div className="card">
                            <h3 className="mb-3">Find Contact</h3>

                            {/* Mode tabs */}
                            <div style={{ display: 'flex', gap: '0.5rem', marginBottom: '1rem' }}>
                                {[
                                    { key: 'search', icon: '🔍', label: 'Search' },
                                    { key: 'qrid', icon: '⌨️', label: 'QR ID' },
                                ].map(m => (
                                    <button key={m.key} onClick={() => { setFindMode(m.key); setError(null); }}
                                        style={{
                                            flex: 1, padding: '0.6rem', borderRadius: '8px', cursor: 'pointer',
                                            border: findMode === m.key ? '2px solid var(--primary)' : '2px solid var(--border)',
                                            background: findMode === m.key ? 'var(--primary)' : 'white',
                                            color: findMode === m.key ? 'white' : 'inherit', fontWeight: '600'
                                        }}>
                                        {m.icon} {m.label}
                                    </button>
                                ))}
                            </div>

                            {/* Search by name/mobile */}
                            {findMode === 'search' && (
                                <div>
                                    <input
                                        className="form-input"
                                        placeholder="Type name or mobile number..."
                                        value={searchQuery}
                                        onChange={e => setSearchQuery(e.target.value)}
                                        autoFocus
                                    />
                                    {searching && <div style={{ textAlign: 'center', padding: '1rem', color: 'var(--text-medium)' }}>🔍 Searching...</div>}
                                    {searchResults.length > 0 && (
                                        <div style={{ marginTop: '0.5rem', border: '1px solid var(--border)', borderRadius: '10px', overflow: 'hidden' }}>
                                            {searchResults.map(user => (
                                                <div key={user.id} onClick={() => handleSelectContact(user)}
                                                    style={{ padding: '0.75rem 1rem', cursor: 'pointer', borderBottom: '1px solid var(--border)', display: 'flex', justifyContent: 'space-between', alignItems: 'center' }}
                                                    onMouseEnter={e => e.currentTarget.style.background = 'var(--bg-light)'}
                                                    onMouseLeave={e => e.currentTarget.style.background = 'white'}
                                                >
                                                    <div>
                                                        <div style={{ fontWeight: '600' }}>{user.name}</div>
                                                        <div style={{ fontSize: '0.8rem', color: 'var(--text-medium)' }}>+91 {user.mobile} • {user.role}</div>
                                                    </div>
                                                    <div style={{ color: 'var(--primary)', fontWeight: '700' }}>Select →</div>
                                                </div>
                                            ))}
                                        </div>
                                    )}
                                    {searchQuery.length >= 2 && !searching && searchResults.length === 0 && (
                                        <div style={{ textAlign: 'center', padding: '1rem', color: 'var(--text-medium)' }}>No users found for "{searchQuery}"</div>
                                    )}
                                </div>
                            )}

                            {/* Enter QR ID manually */}
                            {findMode === 'qrid' && (
                                <div>
                                    <input
                                        className="form-input"
                                        placeholder="e.g. UDHAR-9717726507"
                                        value={qrIdInput}
                                        onChange={e => setQrIdInput(e.target.value)}
                                        autoFocus
                                    />
                                    <button className="btn btn-primary" style={{ width: '100%', marginTop: '0.5rem' }} onClick={handleQrIdLookup} disabled={searching || !qrIdInput.trim()}>
                                        {searching ? '🔍 Looking up...' : '🔍 Find by QR ID'}
                                    </button>
                                </div>
                            )}

                            {error && <div className="alert alert-error mt-2">{error}</div>}
                        </div>
                    )}

                    {/* ── Step 2: Transaction Details ── */}
                    {step === 2 && selectedContact && (
                        <div className="card">
                            <h3 className="mb-3">Transaction Details</h3>

                            {/* Selected contact */}
                            <div style={{ background: 'var(--bg-light)', borderRadius: '10px', padding: '0.75rem 1rem', marginBottom: '1rem', display: 'flex', justifyContent: 'space-between', alignItems: 'center' }}>
                                <div>
                                    <div style={{ fontWeight: '700' }}>{selectedContact.name}</div>
                                    <div style={{ fontSize: '0.8rem', color: 'var(--text-medium)' }}>+91 {selectedContact.mobile}</div>
                                </div>
                                <button className="btn btn-outline" style={{ padding: '0.3rem 0.6rem', fontSize: '0.8rem' }} onClick={() => { setStep(1); setSelectedContact(null); }}>Change</button>
                            </div>

                            {/* Direction */}
                            <div className="form-group">
                                <label className="form-label">Transaction Type</label>
                                <div style={{ display: 'flex', gap: '0.5rem' }}>
                                    <button onClick={() => {
                                        if ((txnModule === 'SHOP' || txnModule === 'WHOLESALER') && balanceData && balanceData.iOweThem === 0) {
                                            setError(`You don't owe any pending udhar to pay off.`);
                                            return;
                                        }
                                        setDirection('gave');
                                        setError(null);
                                    }}
                                        style={{ flex: 1, padding: '0.75rem', borderRadius: '10px', cursor: 'pointer', border: direction === 'gave' ? '2px solid #ef4444' : '2px solid var(--border)', background: direction === 'gave' ? '#fef2f2' : 'white', color: direction === 'gave' ? '#ef4444' : 'inherit', fontWeight: '600', opacity: ((txnModule === 'SHOP' || txnModule === 'WHOLESALER') && balanceData && balanceData.iOweThem === 0) ? 0.5 : 1 }}>
                                        📤 I Gave Credit
                                    </button>
                                    <button onClick={() => { setDirection('received'); setError(null); }}
                                        style={{ flex: 1, padding: '0.75rem', borderRadius: '10px', cursor: 'pointer', border: direction === 'received' ? '2px solid #22c55e' : '2px solid var(--border)', background: direction === 'received' ? '#f0fdf4' : 'white', color: direction === 'received' ? '#22c55e' : 'inherit', fontWeight: '600' }}>
                                        📥 I Received Credit
                                    </button>
                                </div>
                            </div>

                            {/* Module */}
                            <div className="form-group">
                                <label className="form-label">Module</label>
                                <select className="form-input form-select" value={txnModule} onChange={e => setTxnModule(e.target.value)}>
                                    {moduleOptions.map(o => <option key={o.value} value={o.value}>{o.label}</option>)}
                                </select>
                            </div>

                            {/* Amount */}
                            <div className="form-group">
                                <label className="form-label">Amount (₹) *</label>
                                <input type="number" className="form-input" placeholder="0" value={amount} onChange={e => setAmount(e.target.value)} style={{ fontSize: '1.5rem', fontWeight: '700' }} min="1" />
                                {(txnModule === 'SHOP' || txnModule === 'WHOLESALER') && direction === 'gave' && balanceData && (
                                    <div style={{ fontSize: '0.8rem', color: 'var(--text-medium)', marginTop: '0.3rem' }}>
                                        Max payable: ₹{balanceData.iOweThem}
                                    </div>
                                )}
                            </div>

                            {/* Description */}
                            <div className="form-group">
                                <label className="form-label">Note / Description</label>
                                <input className="form-input" placeholder="e.g. Grocery items, Monthly rent..." value={description} onChange={e => setDescription(e.target.value)} />
                            </div>

                            {/* Invoice fields for Wholesaler */}
                            {txnModule === 'WHOLESALER' && (
                                <>
                                    <div className="form-group">
                                        <label className="form-label">Invoice Number</label>
                                        <input className="form-input" placeholder="e.g. INV-2024-001" value={invoiceNumber} onChange={e => setInvoiceNumber(e.target.value)} />
                                    </div>
                                    <div className="form-group">
                                        <label className="form-label">Invoice Date</label>
                                        <input type="date" className="form-input" value={invoiceDate} onChange={e => setInvoiceDate(e.target.value)} />
                                    </div>
                                </>
                            )}

                            {error && <div className="alert alert-error mb-2">{error}</div>}

                            <div style={{ display: 'flex', gap: '0.5rem' }}>
                                <button className="btn btn-outline" onClick={() => setStep(1)}>← Back</button>
                                <button className="btn btn-primary" style={{ flex: 1 }} onClick={() => {
                                    if (!amount || parseFloat(amount) <= 0) {
                                        setError('Enter a valid amount.');
                                        return;
                                    }
                                    if ((txnModule === 'SHOP' || txnModule === 'WHOLESALER') && direction === 'gave') {
                                        if (balanceData && parseFloat(amount) > balanceData.iOweThem) {
                                            setError(`For ${txnModule.toLowerCase()}s, you cannot pay more than your pending udhar of ₹${balanceData.iOweThem}.`);
                                            return;
                                        }
                                        if (balanceData && balanceData.iOweThem === 0) {
                                            setError(`You don't owe any pending udhar to pay off.`);
                                            return;
                                        }
                                    }
                                    setError(null);
                                    setStep(3);
                                }}>
                                    Review →
                                </button>
                            </div>
                        </div>
                    )}

                    {/* ── Step 3: Confirm ── */}
                    {step === 3 && (
                        <div className="card">
                            <h3 className="mb-3">Confirm Transaction</h3>

                            <div style={{ background: 'var(--bg-light)', borderRadius: '12px', padding: '1.25rem', marginBottom: '1.5rem' }}>
                                <div style={{ display: 'flex', justifyContent: 'space-between', marginBottom: '0.75rem' }}>
                                    <span style={{ color: 'var(--text-medium)' }}>Contact</span>
                                    <span style={{ fontWeight: '700' }}>{selectedContact?.name}</span>
                                </div>
                                <div style={{ display: 'flex', justifyContent: 'space-between', marginBottom: '0.75rem' }}>
                                    <span style={{ color: 'var(--text-medium)' }}>Mobile</span>
                                    <span>+91 {selectedContact?.mobile}</span>
                                </div>
                                <div style={{ display: 'flex', justifyContent: 'space-between', marginBottom: '0.75rem' }}>
                                    <span style={{ color: 'var(--text-medium)' }}>Type</span>
                                    <span style={{ fontWeight: '600', color: direction === 'gave' ? '#ef4444' : '#22c55e' }}>
                                        {direction === 'gave' ? '📤 I Gave Credit' : '📥 I Received Credit'}
                                    </span>
                                </div>
                                <div style={{ display: 'flex', justifyContent: 'space-between', marginBottom: '0.75rem' }}>
                                    <span style={{ color: 'var(--text-medium)' }}>Module</span>
                                    <span>{moduleOptions.find(o => o.value === txnModule)?.label}</span>
                                </div>
                                <div style={{ display: 'flex', justifyContent: 'space-between', marginBottom: description ? '0.75rem' : 0 }}>
                                    <span style={{ color: 'var(--text-medium)' }}>Amount</span>
                                    <span style={{ fontWeight: '800', fontSize: '1.25rem', color: 'var(--primary)' }}>₹{parseFloat(amount).toLocaleString()}</span>
                                </div>
                                {description && (
                                    <div style={{ display: 'flex', justifyContent: 'space-between' }}>
                                        <span style={{ color: 'var(--text-medium)' }}>Note</span>
                                        <span style={{ fontStyle: 'italic' }}>{description}</span>
                                    </div>
                                )}
                            </div>

                            {error && <div className="alert alert-error mb-2">{error}</div>}

                            <div style={{ display: 'flex', gap: '0.5rem' }}>
                                <button className="btn btn-outline" onClick={() => setStep(2)}>← Edit</button>
                                <button className="btn btn-primary" style={{ flex: 1, padding: '1rem', fontSize: '1.1rem' }} onClick={handleSubmit} disabled={submitting}>
                                    {submitting ? '⏳ Recording...' : '✅ Confirm & Record'}
                                </button>
                            </div>
                        </div>
                    )}
                </div>
            );
        };


        // History Page (All Transactions)
        const HistoryPage = () => {
            const { currentUser, navigate } = useContext(AppContext);
            const [transactions, setTransactions] = useState([]);
            const [loading, setLoading] = useState(true);

            useEffect(() => {
                const token = localStorage.getItem('udharPayToken');
                if (!token) return;
                axios.get('http://localhost:5000/api/transactions?limit=100', {
                    headers: { Authorization: `Bearer ${token}` }
                }).then(res => {
                    setTransactions(res.data.data.transactions);
                }).catch(err => console.error('Failed to load history:', err))
                    .finally(() => setLoading(false));
            }, []);

            return (
                <div className="container">
                    <button className="btn btn-outline mb-2" onClick={() => navigate('dashboard')}>← Back</button>
                    <div className="card-header mb-2"><h2>📜 All Transactions</h2></div>
                    <div className="card">
                        {loading ? (
                            <div className="loading"><div className="spinner"></div><p>Loading...</p></div>
                        ) : transactions.length === 0 ? (
                            <div className="empty-state">
                                <div className="empty-icon">📊</div>

                    '<div class="totals"><div class="tbox"><div class="tamt" style="color:#1f2937">&#x20B9;' + totalUdhar.toLocaleString() + '</div><div class="tlbl">Total Udhar</div></div>' +

                    '<div class="tbox"><div class="tamt" style="color:#dc2626">&#x20B9;' + totalPending.toLocaleString() + '</div><div class="tlbl">Still Pending</div></div></div>' +
                    '<div class="sec">Transaction Details</div>' +
                    (filteredTxns.length === 0 ? '<p style="text-align:center;color:#9ca3af;padding:16pt 0;">No transactions found.</p>' : '<table>' + txnRows + '<\/table>') +
                    '<div class="foot">Generated by <strong>UDHAR-Pay</strong> &bull; ' + now.toLocaleDateString('en-IN', { day: '2-digit', month: 'long', year: 'numeric' }) + ' &bull; Confidential<\/div>' +
                    '<script>window.onload=function(){window.focus();window.print();};<\/script><\/body><\/html>';

                const pw = window.open('', '_blank', 'width=900,height=1100,scrollbars=yes');
                if (pw) { pw.document.write(html); pw.document.close(); }
                else { alert('Please allow popups for this site to print the report.'); }
            };

            const exportToCSV = () => {
                const q = (val) => `"${String(val ?? '').replace(/"/g, '""')}"`;
                const fmt = (d) => new Date(d).toLocaleDateString('en-IN', { day: '2-digit', month: 'short', year: 'numeric' });

                const lines = [];
                // Company + Customer Header
                lines.push([q('UDHAR-Pay — Udhar Report')].join(','));
                lines.push([q(`Account Holder: ${currentUser?.name}`), q(`Mobile: +91 ${currentUser?.mobile}`), q(`Role: ${currentUser?.role || 'Customer'}`)].join(','));
                lines.push([q(`Report Type: ${filter === 'unsettled' ? 'Unsettled Udhar' : filter === 'settled' ? 'Settled Udhar' : 'All Udhar Records'}`)].join(','));
                lines.push([q(`Generated: ${now.toLocaleDateString('en-IN', { day: '2-digit', month: 'long', year: 'numeric' })}`)].join(','));
                lines.push(''); // blank row

                // Column Headers
                lines.push([
                    q('#'), q('Udhar Date'), q('Type'), q('Category'),
                    q('Udhar Given By'), q('Udhar Taken By'), q('Description'),
                    q('Udhar Amount (Rs)'), q('Paid Amount (Rs)'), q('Pending Amount (Rs)'),

                    const { isSettled, totalPaid, pendingAmount, payments } = getSettledStatus(txn);
                    const giver = isSender ? currentUser?.name : (other?.name || 'Unknown');
                    const taker = isSender ? (other?.name || 'Unknown') : currentUser?.name;

                    if (payments.length === 0) {
                        lines.push([
                            q(i + 1), q(fmt(txn.createdAt)), q(isSender ? 'Udhar Diya' : 'Udhar Liya'), q(txn.module),
                            q(giver), q(taker), q(txn.description || ''),
                            q(txn.amount), q(totalPaid), q(Math.max(0, pendingAmount)),
                            q(isSettled ? 'Settled' : 'Pending'), q('-'), q('-'), q('-'),

                    } else {
                        payments.forEach((p, pi) => {
                            const payerName = p.payerId === currentUser?.id ? currentUser?.name : (other?.name || 'Other Party');

                            lines.push([
                                q(pi === 0 ? i + 1 : ''), q(pi === 0 ? fmt(txn.createdAt) : ''), q(pi === 0 ? (isSender ? 'Udhar Diya' : 'Udhar Liya') : ''), q(pi === 0 ? txn.module : ''),

                const totalPaidBack = filteredTxns.reduce((s, t) => s + getSettledStatus(t).totalPaid, 0);
                lines.push([q(''), q(''), q(''), q(''), q(''), q(''), q('TOTAL'), q(totalUdhar), q(totalPaidBack), q(Math.max(0, totalUdhar - totalPaidBack)), q(''), q(''), q(''), q('')].join(','));

                const csvContent = '\uFEFF' + lines.join('\n'); // BOM for Excel UTF-8
                const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
                const url = URL.createObjectURL(blob);
                const link = document.createElement('a');
                link.href = url;
                link.download = `UdharPay_Report_${currentUser?.name?.replace(/\s+/g, '_')}_${now.toISOString().slice(0, 10)}.csv`;

                                            <div style={{ fontSize: '0.7rem', color: '#6B7280' }}>Digital Udhar • Zero Interest • Total Transparency</div>
                                        </div>

                                    <div style={{ textAlign: 'right' }}>
                                        <div style={{ fontSize: '0.75rem', color: '#6B7280' }}>Report Generated</div>
                                        <div style={{ fontWeight: '700', color: '#1F2937', fontSize: '0.85rem' }}>{now.toLocaleDateString('en-IN', { day: '2-digit', month: 'long', year: 'numeric' })}</div>
                                    </div>

                                {/* Account Holder + Report Type */}
                                <div style={{ display: 'flex', justifyContent: 'space-between', flexWrap: 'wrap', gap: '1rem', marginBottom: '1rem' }}>

                                        <div style={{ fontWeight: '800', fontSize: '1.2rem', color: '#1F2937' }}>{currentUser?.name}</div>

            const { navigate, login } = useContext(AppContext);
            const [mobile, setMobile] = React.useState('');
            const [password, setPassword] = React.useState('');
            const [error, setError] = React.useState('');
            const [loading, setLoading] = React.useState(false);

            const handleAdminLogin = async () => {
                setLoading(true);
                setError('');
                try {
                    console.log('Attempting admin login:', mobile);
                    const response = await apiCall('/api/auth/login', 'POST', { mobile, password });
                    console.log('Admin login response:', response);

                    if (response.success) {
                        const userRole = response.data?.user?.role;
                        console.log('User Role from API:', userRole);

                        if (userRole === 'ADMIN' || userRole === 'Admin') {

                            login(response.data.user, response.data.token);

                                        </div>
                                    </div>
                                </div>

                                        <input
                                            type="text"
                                            value={cmsConfig.bannerUrl || ''}
                                            onChange={e => setCmsConfig({ ...cmsConfig, bannerUrl: e.target.value })}
                                            className="form-input"
                                            style={{ width: '100%' }}
                                        />
                                    </div>
                                    <div>
                                        <label style={{ display: 'block', marginBottom: '0.5rem', fontSize: '0.9rem' }}>About Us Text</label>
                                        <textarea
                                            value={cmsConfig.aboutUs || ''}
                                            onChange={e => setCmsConfig({ ...cmsConfig, aboutUs: e.target.value })}
                                            className="form-input"
                                            style={{ width: '100%', minHeight: '100px' }}
                                        />
                                    </div>
                                    <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: '1rem' }}>
                                        <div>
                                            <label style={{ display: 'block', marginBottom: '0.5rem', fontSize: '0.9rem' }}>Support Email</label>
                                            <input
                                                type="email"
                                                value={cmsConfig.contactEmail || ''}
                                                onChange={e => setCmsConfig({ ...cmsConfig, contactEmail: e.target.value })}
                                                className="form-input"
                                                style={{ width: '100%' }}
                                            />
                                        </div>
                                        <div>
                                            <label style={{ display: 'block', marginBottom: '0.5rem', fontSize: '0.9rem' }}>Support Phone</label>
                                            <input
                                                type="text"
                                                value={cmsConfig.contactPhone || ''}
                                                onChange={e => setCmsConfig({ ...cmsConfig, contactPhone: e.target.value })}
                                                className="form-input"
                                                style={{ width: '100%' }}
                                            />
                                        </div>
                                    </div>
                                    <div>
                                        <label style={{ display: 'block', marginBottom: '0.5rem', fontSize: '0.9rem' }}>Support Hours</label>
                                        <input
                                            type="text"
                                            value={cmsConfig.contactHours || ''}
                                            onChange={e => setCmsConfig({ ...cmsConfig, contactHours: e.target.value })}
                                            className="form-input"
                                            style={{ width: '100%' }}
                                            placeholder="e.g. Mon-Sat, 9 AM - 6 PM"
                                        />
                                    </div>
                                    <div>
                                        <label style={{ display: 'block', marginBottom: '0.5rem', fontSize: '0.9rem' }}>General Contact Text (Optional)</label>
                                        <textarea
                                            value={cmsConfig.contactUs || ''}
                                            onChange={e => setCmsConfig({ ...cmsConfig, contactUs: e.target.value })}
                                            className="form-input"
                                            style={{ width: '100%', minHeight: '80px' }}
                                        />
                                    </div>
                                    <button type="submit" className="btn btn-primary" style={{ alignSelf: 'flex-start' }}>Save Changes</button>
                                </form>
                            </div>
                        )}

                        {/* ADMINS TAB */}
                        {activeTab === 'admins' && (
                            <div className="card">
                                <h3>Admin Management</h3>
                                <button onClick={() => setShowCreateAdmin(true)} className="btn btn-primary" style={{ marginTop: '1rem' }}>+ Register New Admin</button>

                                {showCreateAdmin && (
                                    <div style={{ marginTop: '1.5rem', padding: '1.5rem', background: '#f9fafb', borderRadius: '8px' }}>
                                        <h4>Register New Admin</h4>
                                        <form onSubmit={handleCreateAdmin} style={{ display: 'grid', gap: '1rem', maxWidth: '400px', marginTop: '1rem' }}>
                                            <input name="name" placeholder="Full Name" required className="form-input" />
                                            <input name="mobile" placeholder="Mobile Number" required className="form-input" />
                                            <input name="password" type="password" placeholder="Password" required className="form-input" />
                                            <div style={{ display: 'flex', gap: '1rem' }}>
                                                <button type="submit" className="btn btn-primary">Create</button>
                                                <button type="button" onClick={() => setShowCreateAdmin(false)} className="btn btn-outline">Cancel</button>
                                            </div>
                                        </form>
                                    </div>
                                )}
                            </div>
                        )}
                    </main>

                    {/* EDIT USER MODAL */}
                    {selectedUser && (
                        <div style={{ position: 'fixed', inset: 0, background: 'rgba(0,0,0,0.5)', display: 'flex', alignItems: 'center', justifyContent: 'center', zIndex: 1000 }}>
                            <div style={{ background: 'white', padding: '2rem', borderRadius: '12px', width: '90%', maxWidth: '500px', maxHeight: '90vh', overflowY: 'auto' }}>
                                <h3>Edit User: {selectedUser.name}</h3>
                                <form onSubmit={handleUpdateUser} style={{ display: 'grid', gap: '1rem', marginTop: '1.5rem' }}>
                                    <div>

                                        <input value={selectedUser.name} onChange={e => setSelectedUser({ ...selectedUser, name: e.target.value })} className="form-input" style={{ width: '100%' }} />
                                    </div>
                                    <div>
                                        <label>Mobile</label>
                                        <input value={selectedUser.mobile} onChange={e => setSelectedUser({ ...selectedUser, mobile: e.target.value })} className="form-input" style={{ width: '100%' }} />
                                    </div>

                                        <label>Role</label>
                                        <select value={selectedUser.role} onChange={e => setSelectedUser({ ...selectedUser, role: e.target.value })} className="form-input" style={{ width: '100%' }}>
                                            <option value="CUSTOMER">CUSTOMER</option>
                                            <option value="SHOPKEEPER">SHOPKEEPER</option>
                                            <option value="WHOLESALER">WHOLESALER</option>
                                            <option value="ADMIN">ADMIN</option>
                                        </select>
                                    </div>
                                    <div>
                                        <label>Status</label>
                                        <select value={selectedUser.isActive} onChange={e => setSelectedUser({ ...selectedUser, isActive: e.target.value === 'true' })} className="form-input" style={{ width: '100%' }}>
                                            <option value="true">Active</option>
                                            <option value="false">Inactive</option>
                                        </select>
                                    </div>

                                        <input placeholder="Update Aadhaar" value={selectedUser.aadhaarNumber || ''} onChange={e => setSelectedUser({ ...selectedUser, aadhaarNumber: e.target.value })} className="form-input" style={{ width: '100%' }} />
                                    </div>
                                    <div>
                                        <label>GSTIN</label>
                                        <input placeholder="Update GST" value={selectedUser.gstNumber || ''} onChange={e => setSelectedUser({ ...selectedUser, gstNumber: e.target.value })} className="form-input" style={{ width: '100%' }} />
                                    </div>

                                    <div style={{ display: 'flex', gap: '1rem', marginTop: '1rem' }}>
                                        <button type="submit" className="btn btn-primary">Save Changes</button>
