                        </div>
                    )}
                </div>
            );
        };

        // ─── Payment Settings Page ──────────────────────────────────────────────
        const PaymentSettingsPage = () => {
            const { currentUser, navigate, setState } = useContext(AppContext);
            const [profile, setProfile] = useState({});
            const [loading, setLoading] = useState(true);
            const [saving, setSaving] = useState(false);
            const [message, setMessage] = useState(null);

            // Fetch profile with payment details
            useEffect(() => {
                const token = localStorage.getItem('udharPayToken');
                axios.get('http://localhost:5000/api/auth/profile', {
                    headers: { Authorization: `Bearer ${token}` }
                }).then(res => {
                    setProfile(res.data.data);
                }).catch(err => console.error(err))
                    .finally(() => setLoading(false));
            }, []);

            const handleSave = async () => {
                setSaving(true);
                try {
                    const token = localStorage.getItem('udharPayToken');
                    const res = await axios.put('http://localhost:5000/api/auth/profile', {
                        upiId: profile.upiId,
                        bankAccountNumber: profile.bankAccountNumber,
                        bankIfsc: profile.bankIfsc,
                        bankAccountName: profile.bankAccountName,
                        bankName: profile.bankName,
                    }, { headers: { Authorization: `Bearer ${token}` } });

                    setMessage({ type: 'success', text: 'Payment details saved successfully!' });
                    // Update global user state if needed (though payment details aren't in main user object usually)
                } catch (err) {
                    setMessage({ type: 'error', text: err.response?.data?.message || 'Failed to save details.' });
                } finally {
                    setSaving(false);
                }
            };

            if (loading) return <div className="container center-content"><div className="spinner"></div></div>;

            return (
                <div className="container">
                    <button className="btn btn-outline mb-2" onClick={() => navigate('dashboard')}>← Back</button>
                    <h2>💳 Payment Settings</h2>
                    <p className="text-muted mb-3">Save your UPI or Bank details so others can pay you easily.</p>

                    {message && (
                        <div className={`alert alert-${message.type} mb-3`}>
                            {message.text}
                        </div>
                    )}

                    <div className="card mb-3">
                        <div style={{ display: 'flex', alignItems: 'center', gap: '0.75rem', marginBottom: '1rem', borderBottom: '1px solid var(--border)', paddingBottom: '0.75rem' }}>
                            <div style={{ fontSize: '1.5rem' }}>📱</div>
                            <div>
                                <h3 style={{ margin: 0 }}>UPI Details</h3>
                                <div style={{ fontSize: '0.8rem', color: 'var(--text-light)' }}>Receive payments via GPay, PhonePe, Paytm</div>
                            </div>
                        </div>
                        <div className="form-group">
                            <label className="form-label">Your UPI ID (VPA)</label>
                            <input
                                className="form-input"
                                placeholder="e.g. 9876543210@paytm"
                                value={profile.upiId || ''}
                                onChange={e => setProfile({ ...profile, upiId: e.target.value })}
                            />
                        </div>
                    </div>

                    <div className="card mb-3">
                        <div style={{ display: 'flex', alignItems: 'center', gap: '0.75rem', marginBottom: '1rem', borderBottom: '1px solid var(--border)', paddingBottom: '0.75rem' }}>
                            <div style={{ fontSize: '1.5rem' }}>🏦</div>
                            <div>
                                <h3 style={{ margin: 0 }}>Bank Account Details</h3>
                                <div style={{ fontSize: '0.8rem', color: 'var(--text-light)' }}>For direct bank transfers</div>
                            </div>
                        </div>
                        <div className="form-group">
                            <label className="form-label">Account Number</label>
                            <input className="form-input" placeholder="Enter account number" value={profile.bankAccountNumber || ''} onChange={e => setProfile({ ...profile, bankAccountNumber: e.target.value })} />
                        </div>
                        <div className="form-group">
                            <label className="form-label">IFSC Code</label>
                            <input className="form-input" placeholder="e.g. HDFC0001234" value={profile.bankIfsc || ''} onChange={e => setProfile({ ...profile, bankIfsc: e.target.value.toUpperCase() })} />
                        </div>
                        <div className="form-group">
                            <label className="form-label">Account Holder Name</label>
                            <input className="form-input" placeholder="Name as in bank records" value={profile.bankAccountName || ''} onChange={e => setProfile({ ...profile, bankAccountName: e.target.value })} />
                        </div>
                        <div className="form-group">
                            <label className="form-label">Bank Name</label>
                            <input className="form-input" placeholder="e.g. HDFC Bank" value={profile.bankName || ''} onChange={e => setProfile({ ...profile, bankName: e.target.value })} />
                        </div>
                    </div>

                    <button className="btn btn-primary btn-large" style={{ width: '100%' }} onClick={handleSave} disabled={saving}>
                        {saving ? '⏳ Saving...' : '💾 Save Payment Details'}
                    </button>
                </div>
            );
        };

        // App Component
        const App = () => {
            const store = useAppStore();

            // Check for saved user
            useEffect(() => {
                const savedUser = localStorage.getItem('udharPayUser');
                if (savedUser) {
                    const user = JSON.parse(savedUser);
                    store.setState({
                        currentUser: user,
                        isAuthenticated: true,
                        currentPage: 'dashboard'
                    });
                }
            }, []);

            const renderPage = () => {
                switch (store.currentPage) {
                    case 'landing':
                        return <LandingPage />;
                    case 'login':
                    case 'register':
                        return <LoginPage />;
                    case 'dashboard':
                        return <Dashboard />;
                    case 'inbox':
                        return <InboxPage />;
                    case 'my-qr':
                        return <MyQRPage />;
                    case 'scan-qr':
                        return <ScanQRPage />;
                    case 'record-txn':
                        return <RecordTransactionPage />;
                    case 'p2p':
                        return <ModulePage module="FRIEND" />;
                    case 'shopkeeper':
                        return <ModulePage module="SHOP" />;
                    case 'wholesaler':
                        return <ModulePage module="WHOLESALER" />;
                    case 'history':
                        return <HistoryPage />;
                    case 'i-still-owe':
                        return <IStillOwePage />;
                    case 'others-owe-me':
                        return <OthersOweMePage />;
                    case 'udhar-report':
                        return <UdharReportPage />;
                    case 'payment-settings':
                        return <PaymentSettingsPage />;
                    case 'admin-login':
                        return <AdminLoginPage />;
                    case 'admin':
                        return <AdminDashboard />;
                    default:
                        return store.isAuthenticated ? <Dashboard /> : <LandingPage />;
                }
            };

            return (
                <AppContext.Provider value={store}>
                    <div className="app-container">
                        {store.isAuthenticated && store.currentPage !== 'landing' && store.currentPage !== 'admin' && (
                            <header className="header">
                                <div className="header-content">
                                    <AppLogo onClick={() => store.navigate('dashboard')} light={true} />
                                    <nav className="nav">
                                        <a href="#" className="nav-link" onClick={(e) => { e.preventDefault(); store.navigate('dashboard'); }}>
                                            Dashboard
                                        </a>
                                        <a href="#" className="nav-link" onClick={(e) => { e.preventDefault(); store.navigate('payment-settings'); }}>
                                            💳 Payment Details
                                        </a>
                                        <a href="#" className="nav-link" onClick={(e) => { e.preventDefault(); store.navigate('my-qr'); }}>
                                            My QR
                                        </a>
                                        <button className="btn btn-accent" onClick={() => store.logout()}>
                                            Logout
                                        </button>
                                    </nav>
                                </div>
                            </header>
                        )}

                        {renderPage()}

                        {store.isAuthenticated && (
                            <nav className="bottom-nav">
                                <a href="#" className={`bottom-nav-item ${store.currentPage === 'dashboard' ? 'active' : ''}`} onClick={(e) => { e.preventDefault(); store.navigate('dashboard'); }}>
                                    <div className="bottom-nav-icon">🏠</div>
                                    <div>Home</div>
                                </a>
                                <a href="#" className={`bottom-nav-item ${store.currentPage === 'record-txn' ? 'active' : ''}`} onClick={(e) => { e.preventDefault(); store.navigate('record-txn'); }}>
                                    <div className="bottom-nav-icon">✏️</div>
                                    <div>Record</div>
                                </a>
                                <a href="#" className={`bottom-nav-item ${store.currentPage === 'my-qr' ? 'active' : ''}`} onClick={(e) => { e.preventDefault(); store.navigate('my-qr'); }}>
                                    <div className="bottom-nav-icon">🎫</div>
                                    <div>My QR</div>
                                </a>
                                <a href="#" className="bottom-nav-item" onClick={(e) => { e.preventDefault(); store.navigate('payment-settings'); }}>
                                    <div className="bottom-nav-icon">👤</div>
                                    <div>Profile</div>
                                </a>
                            </nav>
                        )}
                    </div>
                </AppContext.Provider >
            );
        };

        // Render App
        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>

</html>
